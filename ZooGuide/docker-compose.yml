services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - USE_LLM=false
      - CORS_ORIGINS=http://localhost:16084,http://127.0.0.1:16084
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "16084:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: zooguide-network
