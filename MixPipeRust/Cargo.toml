[package]
name = "mixpipe"
version = "0.1.1"
edition = "2024"
description = "A composable inference pipeline framework for Rust, inspired by MediaPipe"
license = "MIT"
repository = "https://github.com/anomalyco/MixPipeRust"
keywords = ["ml", "inference", "pipeline", "onnx", "pose"]
categories = ["multimedia", "graphics", "science"]

[features]
default = ["onnx"]
onnx = ["ort"]

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
dirs = "5"

[dependencies.ort]
package = "ort"
version = "2.0.0-rc.13"
optional = true
features = ["ndarray"]

[dependencies.ndarray]
version = "0.17"

[dependencies.xcap]
version = "0.0.14"
optional = true
