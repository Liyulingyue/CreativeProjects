# Pinned versions of everything the backend depends on.
#
# requirements.txt says what the code needs; this says what it was
# actually tested with. Every version there is a floor, so a rebuild
# six months from now would pick up whatever the packages have become
# since -- lancedb alone has gone from 0.15 to 0.40, which is twenty
# five minor versions of a storage library.
#
# Install this one for a deployment:
#
#     pip install -r requirements.lock
#
# requirements-dev.txt is the same, plus the test runner.
