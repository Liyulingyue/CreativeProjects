services:
  backend:
    build: ./backend
    container_name: sfm-backend
    ports:
      - "8000:8000"
    volumes:
      # The same directory the development stack uses. The two used to
      # point at different places -- compose at ./data, the dev server
      # at backend/data -- so switching between them looked like
      # losing the index and the settings.
      - ./backend/data:/data
    environment:
      - STORAGE_PATH=/data
      - INIT_PASSWORD=${INIT_PASSWORD:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:9010/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-LFM2.5-8B-A1B-Q8_0}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:9011/v1/embeddings}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-LFM2.5-Embedding-350M-Q8_0}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - INDEX_INTERVAL=${INDEX_INTERVAL:-300}
      - AUTO_INDEX_ENABLED=${AUTO_INDEX_ENABLED:-true}
      - INDEX_DEBOUNCE_SECONDS=${INDEX_DEBOUNCE_SECONDS:-10}
      - MAX_AGENT_STEPS=${MAX_AGENT_STEPS:-8}
      - MAX_CONTEXT_TOKENS=${MAX_CONTEXT_TOKENS:-32768}
      - AUTO_DIGEST_ENABLED=${AUTO_DIGEST_ENABLED:-false}
      - AUTO_DIGEST_MODE=${AUTO_DIGEST_MODE:-scheduled}
      - AUTO_DIGEST_HOUR=${AUTO_DIGEST_HOUR:-23}
      - AUTO_DIGEST_INTERVAL_HOURS=${AUTO_DIGEST_INTERVAL_HOURS:-6}
      # The application writes its own log, rotated, and keeps it on the
      # mounted volume so it survives a container being replaced. Without
      # this the only record of what happened is in `docker logs`, which
      # goes away with the container.
      - LOG_FILE=/data/logs/backend.log
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The health endpoint checks the databases, the disk, the vector store
    # and the model endpoints, so an unhealthy container is one that is
    # actually broken rather than merely running.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sfm-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
