[package]
name = "rust-model-inference"
version = "0.1.0"
edition = "2021"
description = "Zero-allocation, mmap zero-copy LLM inference engine in pure Rust"
license = "MIT"

[features]
default = []
parity-trace = []
vulkan = ["dep:ash"]
metal = ["dep:metal"]
gpu = ["vulkan", "metal"]

[dependencies]
memmap2 = "0.9"
half = "2.4"
rayon = "1.10"
image = "0.25"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.8"
unicode_categories = "0.1"
sha2 = "0.10"
ash = { version = "0.38", optional = true }
thiserror = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[[bin]]
name = "micro-bench"
path = "src/bin/micro_bench.rs"
