[package]
name = "worker-monitor-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
mixpipe = "0.1"
ndarray = "0.17"
nokhwa = { version = "0.10", features = ["input-native"] }
base64 = "0.22"
once_cell = "1"
dirs = "5"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = true
