[package]
name = "worker-monitor-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
image = "0.25"
ndarray = "0.17"
base64 = "0.22"
once_cell = "1"
dirs = "5"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
