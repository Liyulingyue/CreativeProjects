[package]
name = "windows-reg-generator"
version = "0.1.0"
edition = "2021"
description = "为 EXE 生成 URL 协议处理器 .reg 注册表文件，并清理本机已注册的前缀"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "links",
    "accesskit",
    "persistence",
] }
winreg = "0.56"
rfd = "0.15"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
